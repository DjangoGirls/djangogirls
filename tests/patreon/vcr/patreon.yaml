        href=\"http://djangogirls.org/\" rel=\"nofollow\">Django Girls</a> is a non-profit
        organization that empowers and helps women to organize free, one-day programming
        workshops by providing tools, resources and support.</strong> It was born
        in July 2014 in Berlin and started by two Polish girls: Ola Sitarska and Ola
        Sendecka.<br><br><strong>We make the world better by bringing more amazing
        women into the world of technology and increasing the diversity in the Django
        community.</strong> We believe that technology is for people and everyone
        should be able to build it. We are making technology more approachable by
        creating simple tools and <a href=\"http://djangogirls.org/resources/\" rel=\"nofollow\">resources</a>
        designed with empathy.<br><br>Django Girls aims to introduce women and girls
        who never coded before to the world of technology and increase the diversity
        of the tech industry. This is achieved by organizing free one-day workshops
        and inviting women to come and learn how to build the internet using <strong>HTML,
        CSS, Python and Django</strong>. Django Girls is a volunteer-run organization
        with volunteers all over the world. <br><br>We started in July 2014 and in
        six years <strong>2,032</strong> volunteers in the Django Girls community
        have organized<strong> 984 events </strong><strong>that allowed more than
        21,277 women to learn about Python and Django for free</strong>. Django Girls
        has been to <strong>526 cities in 98 countries\u00a0</strong>in Europe, Africa,
        North America, South America, Asia and Australia.\u00a0<br><br>Our <a href=\"http://tutorial.djangogirls.org/\">free
        Django tutorial</a> available in English and translated in 19 languages has
        been used by more than 80,000 people and viewed almost 4,000,000 times. Many
        of our alumni are already working as Django developers, attending conferences
        and spreading their knowledge with others (make sure to read <a href=\"http://blog.djangogirls.org/post/105864489478/your-django-story-meet-dori-czapari\">Dori\u2019s</a>
        Django Story, if you haven\u2019t done it yet). <a href=\"http://djangogirls.org/story/\">90
        stories of successful female Django developers</a> have been told on our blog.<br><br>Since
        the first Django Girls workshop in July 2014 we grew unexpectedly fast and
        we couldn\u2019t sustain that growth without some help. In 2015, we introduced
        the paid position of Awesomeness Ambassador to help provide support to other
        volunteers. In 2017, we also introduced the temporary position of Fundraising
        Coordinator to help us raise funds to run our activities. <br><br>All of the
        money gathered here on Patreon will go towards running our Django Girls non-profit
        organization as well as supporting the future growth of Django Girls, allowing
        us to create more learning resources and enabling even more women to discover
        the joy of programming.<br><br><strong>FAQ<br>What\u2019s the impact of your
        work?</strong><br>The results of a survey we conducted in 2017 with almost
        600 past Django Girls attendees to see if Django Girls Foundation actually
        achieves the goal of our mission: to bring more women into tech industry,
        shows that we have indeed made an impact in the tech industry! <strong>21%
        of participants in our survey started working in tech after attending Django
        Girls workshop! 73% of the participants  in our survey are still involved
        in tech activities while 79% of Django Girls alumnis are still learning programming
        after the workshop. </strong>To read more about the impact we are making in
