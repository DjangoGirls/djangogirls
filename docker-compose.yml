services:
  app:
    container_name: djangogirls-app
    build:
      context: .
    stdin_open: true
    tty: true
    init: true
    environment:
      - POSTGRES_USER=djangogirls
      - POSTGRES_PASSWORD=djangogirls
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=djangogirls
    env_file: ./.environment
    depends_on:
      - db
    volumes:
      - .:/var/www/app
      - node_modules:/var/www/app/node_modules
      - static_local:/var/www/app/static/local
      - static_build:/var/www/app/static/build
      - temp_files:/var/www/app/temp
    ports:
      - "${APP_PORT:-8000}:8000"

  db:
    container_name: djangogirls-db
    image: postgres:15.1
    environment:
      POSTGRES_USER: djangogirls
      POSTGRES_PASSWORD: djangogirls
      POSTGRES_DB: djangogirls
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"

volumes:
  pgdata:
  node_modules:
  static_local:
  static_build:
  temp_files:
