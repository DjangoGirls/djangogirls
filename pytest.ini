[pytest]
DJANGO_SETTINGS_MODULE=djangogirls.settings
addopts = --ff --nomigrations
env =
    RECAPTCHA_TESTING=True
env_files =
    .environment
# like pytest-dotenv did: values already set in the environment win over .environment
env_files_skip_if_set = true
# Django 3.2, pytz and dateutil use APIs deprecated in Python 3.12.
# Remove these after upgrading Django and those packages.
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:django.utils.timezone
    ignore:'cgi' is deprecated:DeprecationWarning:django.http.request
    ignore:'locale.getdefaultlocale' is deprecated:DeprecationWarning:django.utils.encoding
    ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:pytz.tzinfo
    ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:dateutil.tz.tz
